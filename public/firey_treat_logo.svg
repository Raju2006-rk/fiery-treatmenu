<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <!-- Flame Gradient -->
    <linearGradient id="flameGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#b91c1c" />
      <stop offset="35%" stop-color="#ef4444" />
      <stop offset="70%" stop-color="#f97316" />
      <stop offset="100%" stop-color="#fbbf24" />
    </linearGradient>

    <!-- Inner Core Flame Gradient -->
    <linearGradient id="coreFlame" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#f97316" />
      <stop offset="100%" stop-color="#fef08a" />
    </linearGradient>

    <!-- Path for Curved Bottom Text -->
    <path id="pieArc" d="M 46 142 A 62 62 0 0 0 154 142" fill="none" />
  </defs>

  <!-- Deep Black Circular Base -->
  <circle cx="100" cy="100" r="98" fill="#0a0a0a" />

  <!-- Radiating Burst Lines around border -->
  <g stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" opacity="0.9">
    <!-- Top left rays -->
    <line x1="28" y1="28" x2="16" y2="16" />
    <line x1="48" y1="18" x2="42" y2="6" />
    <line x1="18" y1="48" x2="6" y2="42" />
    <!-- Top rays -->
    <line x1="82" y1="12" x2="80" y2="2" />
    <line x1="100" y1="10" x2="100" y2="1" />
    <line x1="118" y1="12" x2="120" y2="2" />
    <!-- Top right rays -->
    <line x1="172" y1="28" x2="184" y2="16" />
    <line x1="152" y1="18" x2="158" y2="6" />
    <line x1="182" y1="48" x2="194" y2="42" />
    <!-- Bottom left rays -->
    <line x1="28" y1="172" x2="16" y2="184" />
    <line x1="48" y1="182" x2="42" y2="194" />
    <line x1="18" y1="152" x2="6" y2="158" />
    <!-- Bottom right rays -->
    <line x1="172" y1="172" x2="184" y2="184" />
    <line x1="152" y1="182" x2="158" y2="194" />
    <line x1="182" y1="152" x2="194" y2="158" />
    <!-- Bottom rays -->
    <line x1="82" y1="188" x2="80" y2="198" />
    <line x1="100" y1="190" x2="100" y2="199" />
    <line x1="118" y1="188" x2="120" y2="198" />
  </g>

  <!-- Outer Green Ring -->
  <circle cx="100" cy="100" r="82" fill="none" stroke="#22c55e" stroke-width="5" />

  <!-- Concentric Red Ring -->
  <circle cx="100" cy="100" r="76" fill="none" stroke="#dc2626" stroke-width="3" />

  <!-- Flame Graphic at Top -->
  <g transform="translate(100, 52) scale(0.9)">
    <!-- Main Outer Flame -->
    <path
      d="M 0 16
         C -12 12, -22 -2, -14 -18
         C -12 -22, -8 -24, -4 -25
         C -7 -18, -4 -12, 1 -16
         C 8 -24, 0 -36, 6 -42
         C 12 -34, 18 -26, 17 -16
         C 16 -12, 18 -9, 21 -12
         C 26 -5, 23 4, 19 9
         C 22 7, 24 6, 26 8
         C 28 12, 24 16, 20 18
         C 14 20, 7 21, 0 16 Z"
      fill="url(#flameGrad)"
    />
    <!-- Inner Flame Core -->
    <path
      d="M 0 12
         C -6 9, -10 1, -6 -8
         C -5 -10, -2 -11, 0 -11
         C -2 -8, 0 -5, 2 -7
         C 6 -11, 2 -17, 5 -20
         C 8 -16, 10 -12, 9 -7
         C 8 -5, 10 -4, 11 -5
         C 13 -2, 12 3, 9 6
         C 7 8, 3 10, 0 12 Z"
      fill="url(#coreFlame)"
    />
  </g>

  <!-- ESTD. and 2022 Text -->
  <text x="44" y="80" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="8.5" text-anchor="middle" letter-spacing="1">ESTD.</text>
  <text x="156" y="80" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="8.5" text-anchor="middle" letter-spacing="1">2022</text>

  <!-- 'Firey Treat' Main Title (Bold Stylized Green Script with glow) -->
  <g transform="translate(100, 108)">
    <text
      x="0"
      y="0"
      text-anchor="middle"
      fill="#22c55e"
      stroke="#14532d"
      stroke-width="1.2"
      paint-order="stroke fill"
      font-family="'Brush Script MT', 'Segoe Script', cursive, sans-serif"
      font-weight="bold"
      font-size="34"
      letter-spacing="-0.5"
    >
      Firey Treat
    </text>
  </g>

  <!-- Spatula Underneath 'Firey Treat' -->
  <g transform="translate(100, 119)">
    <!-- Spatula Handle on Left -->
    <path d="M -56 0 L 16 0" stroke="#22c55e" stroke-width="2.8" stroke-linecap="round" />
    <circle cx="-56" cy="0" r="2.2" fill="#22c55e" />
    <!-- Spatula Head on Right with Slots -->
    <path d="M 18 -5 L 36 -5 C 38 -5 39 -3 39 -1 L 39 1 C 39 3 38 5 36 5 L 18 5 Z" fill="#22c55e" />
    <!-- Slits -->
    <line x1="23" y1="-3" x2="33" y2="-3" stroke="#0a0a0a" stroke-width="1.2" stroke-linecap="round" />
    <line x1="23" y1="0" x2="34" y2="0" stroke="#0a0a0a" stroke-width="1.2" stroke-linecap="round" />
    <line x1="23" y1="3" x2="33" y2="3" stroke="#0a0a0a" stroke-width="1.2" stroke-linecap="round" />
  </g>

  <!-- Bottom Curved Subtitle: 'IT'S A FRY & PIE' -->
  <g transform="translate(100, 142)">
    <text
      x="0"
      y="0"
      text-anchor="middle"
      fill="#ffffff"
      font-family="system-ui, -apple-system, sans-serif"
      font-weight="900"
      font-size="10"
      letter-spacing="2"
    >
      IT'S A FRY &amp; PIE
    </text>
  </g>

  <!-- Inner Bottom Red Accent Arc -->
  <path
    d="M 52 156 A 64 64 0 0 0 148 156"
    fill="none"
    stroke="#dc2626"
    stroke-width="3"
    stroke-linecap="round"
  />
</svg>
